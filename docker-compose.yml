services:
  backend:
    build: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      API_KEY: ${API_KEY:-}
      DATABASE_PATH: /data/easy_read.db
      DEBUG: ${DEBUG:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PICTOGRAM_PROVIDERS: ${PICTOGRAM_PROVIDERS:-own,mulberry,openmoji}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ${VITE_API_KEY:-${API_KEY:-}}
    depends_on:
      - backend
    ports:
      - "3000:80"
